[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
publish = false
description = "The 3GIX renderer: applies the laws to compiled matter and draws what is near the camera."

[lib]
name = "renderer"
path = "src/lib.rs"

[[bin]]
name = "gx-renderer"
path = "src/main.rs"

[[bin]]
name = "gx-mock-hub"
path = "src/bin/gx-mock-hub.rs"

[features]
# Browser build support. Off by default; the library builds for
# wasm32-unknown-unknown without it. Filled in by the browser task.
web = []

[dependencies]
gx-core = { git = "https://github.com/benjaminfkile/3gix-core", branch = "grunt" }
wgpu = "30"
wgpu_text = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
pollster = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
png = "0.18"
