[package]
name = "renderer"
version = "0.1.0"
edition = "2021"
publish = false
description = "The 3GIX renderer: applies the laws to compiled matter and draws what is near the camera."

[lib]
name = "renderer"
path = "src/lib.rs"
# cdylib for wasm-pack (the browser build), rlib for the binaries and tests.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gx-renderer"
path = "src/main.rs"

[[bin]]
name = "gx-mock-hub"
path = "src/bin/gx-mock-hub.rs"

[features]
# The browser build: winit on a canvas, wgpu on WebGPU, reqwest's fetch
# client and a web-sys WebSocket for the hub, wasm-bindgen-futures for async,
# and console_error_panic_hook. Only takes effect on wasm32-unknown-unknown;
# the library also builds for that target without it.
web = [
    "wgpu/webgpu",
    "dep:winit",
    "dep:reqwest",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:console_error_panic_hook",
]

[dependencies]
gx-core = { git = "https://github.com/benjaminfkile/3gix-core", branch = "grunt" }
wgpu = "30"
wgpu_text = "30"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.34"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
epaint_default_fonts = "0.36"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.30"
pollster = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
winit = { version = "0.30", optional = true }
reqwest = { version = "0.13", default-features = false, optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "Event",
    "HtmlCanvasElement",
    "MessageEvent",
    "Performance",
    "WebSocket",
    "Window",
    "console",
] }
console_error_panic_hook = { version = "0.1", optional = true }

# wasm-opt runs from web/build.sh instead, with the installed binary.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
